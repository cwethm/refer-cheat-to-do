services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      APP_NAME: refer-cheat-to-do
      APP_ENV: development
      DEBUG: 'true'
      SECURITY_SALT: change-me-to-a-long-random-string
      APP_FULL_BASE_URL: http://localhost:8765
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: refer_cheat_to_do
      DB_USERNAME: refer_cheat_to_do
      DB_PASSWORD: refer_cheat_to_do
      TEST_DB_DATABASE: refer_cheat_to_do_test
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refer_cheat_to_do
      POSTGRES_USER: refer_cheat_to_do
      POSTGRES_PASSWORD: refer_cheat_to_do
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
