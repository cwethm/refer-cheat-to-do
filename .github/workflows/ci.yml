name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refer_cheat_to_do
          POSTGRES_PASSWORD: refer_cheat_to_do
          POSTGRES_DB: refer_cheat_to_do
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refer_cheat_to_do -d refer_cheat_to_do"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_NAME: refer-cheat-to-do
      APP_ENV: ci
      DEBUG: 'false'
      SECURITY_SALT: ci-security-salt-for-tests-only
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: refer_cheat_to_do
      DB_USERNAME: refer_cheat_to_do
      DB_PASSWORD: refer_cheat_to_do
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_DATABASE: refer_cheat_to_do_test
      TEST_DB_USERNAME: refer_cheat_to_do
      TEST_DB_PASSWORD: refer_cheat_to_do

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Prepare databases
        run: |
          export PGPASSWORD="$TEST_DB_PASSWORD"
          until pg_isready -h "$TEST_DB_HOST" -p "$TEST_DB_PORT" -U "$TEST_DB_USERNAME" -d template1; do
            sleep 1
          done
          if ! psql -h "$TEST_DB_HOST" -p "$TEST_DB_PORT" -U "$TEST_DB_USERNAME" -d template1 -v dbname="$TEST_DB_DATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname = :'dbname';" | grep -qx '1'; then
            createdb -h "$TEST_DB_HOST" -p "$TEST_DB_PORT" -U "$TEST_DB_USERNAME" --owner="$TEST_DB_USERNAME" "$TEST_DB_DATABASE"
          fi

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Migration apply (default/test)
        run: |
          bin/cake migrations migrate -c default
          bin/cake migrations migrate -c test

      - name: Migration rollback/reapply (test)
        run: |
          bin/cake migrations rollback -c test
          bin/cake migrations migrate -c test

      - name: Verify test schema tables
        run: |
          export PGPASSWORD="$TEST_DB_PASSWORD"
          for table in users todos tags todos_tags; do
            psql -h "$TEST_DB_HOST" -p "$TEST_DB_PORT" -U "$TEST_DB_USERNAME" -d "$TEST_DB_DATABASE" -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = '${table}');" | grep -qx 't'
          done

      - name: PHP syntax check
        run: composer lint

      - name: Coding standards
        run: composer cs-check

      - name: Static analysis
        run: composer stan

      - name: PHPUnit
        run: composer test
