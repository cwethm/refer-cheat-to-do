name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_NAME: refer-cheat-to-do
      APP_ENV: ci
      DEBUG: 'false'
      SECURITY_SALT: ci-security-salt-for-tests-only
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: refer_cheat_to_do
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TEST_DB_DATABASE: refer_cheat_to_do_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Prepare databases
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d postgres; do
            sleep 1
          done
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d postgres -c "CREATE DATABASE $DB_DATABASE;" || true
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d postgres -c "CREATE DATABASE $TEST_DB_DATABASE;" || true

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Migration apply (default/test)
        run: |
          bin/cake migrations migrate -c default
          bin/cake migrations migrate -c test

      - name: Migration rollback/reapply (test)
        run: |
          bin/cake migrations rollback -c test
          bin/cake migrations migrate -c test

      - name: PHP syntax check
        run: composer lint

      - name: Coding standards
        run: composer cs-check

      - name: Static analysis
        run: composer stan

      - name: PHPUnit
        run: composer test
